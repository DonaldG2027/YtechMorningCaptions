<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Captions - Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="display-page">
    <div id="captionBox">
        <div id="captionText">
            Waiting for captions...
        </div>
    </div>
    <div class="display-page">
        <video id="srcVideo" style="display:none" autoplay loop muted playsinline>
            <source src="test/1000100477.mp4" type="video/mp4">
            <!-- fallback text -->
        </video>

        <canvas id="chromaCanvas" class="bg-media"></canvas>
        <div class="chroma-ui" id="chromaUI">
            <label>Key<input id="keyColor" type="color" value="#323232" title="Key color"></label>
            <label>Tol <input id="tolerance" type="range" min="0" max="200" value="60"></label>
            <label>Scale<input id="processScale" type="range" min="0.25" max="1" step="0.25" value="0.5"></label>
            <label><input id="chromaToggle" type="checkbox" checked> Enabled</label>
        </div>
        <div id="captionBox">
            <div id="captionText">Your caption here</div>
        </div>
    </div>
    <script src="chroma.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="display.js"></script>
</body>
</html>
